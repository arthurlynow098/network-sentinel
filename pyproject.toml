[project]
name = "network-sentinel"
version = "1.0.0"
description = "Mini IDS com Scapy que detecta port scan, ARP spoofing e ICMP flood"
requires-python = ">=3.10"
authors = [{ name = "Arthur Entsev" }]
license = { text = "MIT" }
dependencies = ["scapy>=2.5"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
